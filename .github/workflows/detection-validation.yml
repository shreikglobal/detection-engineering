name: Detection Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-detections:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate detection lifecycle
        run: |
          python3 <<'PY'
          from pathlib import Path
          import sys

          print("Checking detection rules...")

          rules_dir = Path("detections/rules")
          failed = False

          for rule in sorted(rules_dir.glob("*.yml")):
              content = rule.read_text()

              rule_id = None
              status = None
              test_path = None

              for line in content.splitlines():
                  stripped = line.strip()

                  if stripped.startswith("id:"):
                      rule_id = stripped.split(":", 1)[1].strip()

                  elif stripped.startswith("status:"):
                      status = stripped.split(":", 1)[1].strip()

                  elif stripped.startswith("path:"):
                      test_path = stripped.split(":", 1)[1].strip()

              print(f"Checking {rule_id} — status: {status}")

              if status == "Production":
                  if not test_path or not Path(test_path).is_file():
                      print(
                          f"ERROR: {rule_id} is Production "
                          "but has no valid test."
                      )
                      print("Production deployment BLOCKED.")
                      failed = True
                  else:
                      print(f"PASS: {rule_id} has a valid test.")

          if failed:
              sys.exit(1)

          print("Detection validation completed successfully.")
          PY
